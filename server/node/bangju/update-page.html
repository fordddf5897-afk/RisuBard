<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방주 업데이트</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --soft: #8881; --accent: #3d6fe0; --muted: #808590; --danger: #c0392b; --warn: #b9770e; --good: #1e8449; }
  * { box-sizing: border-box; }
  body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; margin: 0 auto; padding: 12px 12px 48px; max-width: 780px; }
  header { display: flex; align-items: baseline; gap: 12px; margin: 2px 0 10px; }
  h1 { font-size: 19px; margin: 0; flex: 1; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header a { font-size: 14px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .line { margin: 4px 0; }
  .line b { font-size: 16px; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 600; color: #fff; vertical-align: 1px; }
  .badge.high { background: var(--danger); }
  .badge.medium { background: var(--warn); }
  .badge.low { background: var(--good); }
  .badge.plain { background: var(--muted); }
  ul, ol { margin: 6px 0; padding-left: 22px; }
  li { margin: 3px 0; }
  code, .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; background: var(--soft); border-radius: 6px; padding: 1px 6px; word-break: break-all; }
  pre.copy { background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  input, button { font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; vertical-align: -3px; accent-color: var(--accent); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.small { padding: 3px 10px; font-size: 13px; }
  details summary { cursor: pointer; }
  .changes { max-height: 320px; overflow-y: auto; font-size: 13px; }
  .changes li span { color: var(--muted); }
  .steps > li { margin: 8px 0; }
  .warn { color: var(--danger); font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>방주 업데이트</h1>
  <a href="/bangju/archive">보관함</a>
  <a href="/">앱 열기</a>
</header>
<p class="note">새 버전이 있는지, 받아도 되는지, 무엇을 누르면 되는지 보여 줍니다. 이 화면은 아무것도 바꾸지 않습니다. 합치기와 NAS 갱신은 직접 누릅니다.</p>

<div id="login" class="box">
  <label>리스버드 비밀번호 (평소 앱을 열 때 넣는 것) <input id="password" type="password" autocomplete="current-password"></label>
  <button id="loginButton" class="primary">들어가기</button>
  <span id="loginError" class="note"></span>
</div>

<div id="main" class="hidden">
  <div class="box" id="current"></div>
  <div class="box" id="image"></div>
  <div class="box" id="upstream"></div>
  <div class="box" id="history"></div>
  <p class="note" id="foot"></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = text => String(text ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const when = iso => { const time = iso ? new Date(iso) : null; return time && !Number.isNaN(time.getTime()) ? time.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : ''; };
  const RISK = { high: ['높음', 'high'], medium: ['중간', 'medium'], low: ['낮음', 'low'], none: ['없음', 'plain'] };
  let token = null, info = null;

  async function login() {
    $('loginError').textContent = '';
    try {
      // 앱과 같은 방식: 비밀번호를 그대로 보내지 않고, 서버가 만들어 준 요약값을 보낸다.
      const digested = await fetch('/api/crypto', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data: $('password').value }) });
      if (!digested.ok) throw new Error('비밀번호를 확인하지 못했습니다 (' + digested.status + ').');
      const response = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: await digested.text() }) });
      if (response.status === 429) throw new Error('시도가 너무 많았습니다. 잠시 뒤에 다시 해 주세요.');
      const json = await response.json();
      if (!json.token) throw new Error('비밀번호가 맞지 않습니다.');
      token = json.token;
      const answer = await fetch('/api/bangju/update/info', { headers: { 'risu-auth': token } });
      if (!answer.ok) throw new Error('설치본 정보를 읽지 못했습니다 (' + answer.status + ').');
      info = await answer.json();
      $('login').classList.add('hidden');
      $('main').classList.remove('hidden');
      await show();
    } catch (error) { $('loginError').textContent = error.message; }
  }

  // GitHub에서 읽는 것은 공개 정보뿐이라 로그인 없이 읽는다.
  async function github(url) {
    try {
      const response = await fetch(url, { cache: 'no-store', headers: url.includes('api.github.com') ? { accept: 'application/vnd.github+json' } : {} });
      if (response.status === 404) return { missing: true };
      if (response.status === 403 || response.status === 429) return { limited: true };
      if (!response.ok) return { failed: response.status };
      return { data: await response.json() };
    } catch (error) { return { failed: String(error.message || error) }; }
  }

  const imageLine = tag => 'image: ghcr.io/' + String(info.repository).toLowerCase() + ':' + tag;
  // NAS에서 설치본을 바꾸는 순서. Container Manager는 '정리'를 먼저 해야 컨테이너 이름이 꼬이지 않는다.
  function nasSteps(tag, project) {
    return '<ol>'
      + '<li>DSM → Container Manager → 프로젝트 → ' + esc(project) + ' → 작업 → <b>중지</b></li>'
      + '<li>"YAML 구성" 탭에서 <code>image:</code>로 시작하는 줄을, 지금 적힌 값이 뭐든, 아래와 같게 바꿉니다. 다른 줄은 그대로 둡니다.'
      + '<pre class="copy" data-copy>' + esc(imageLine(tag)) + '</pre><button class="small" data-copy-button>이 줄 복사</button></li>'
      + '<li><b>저장</b>을 누르고, 묻는 창에서 "빌드하고 시작"이 아니라 <b>변경 사항만 저장</b></li>'
      + '<li>작업 → <b>정리</b> (컨테이너만 지웁니다. 데이터 폴더는 지우지 않습니다)</li>'
      + '<li>작업 → <b>빌드</b>. 끝난 뒤 실행 중이 아니면 작업 → <b>시작</b></li>'
      + '<li>컨테이너 이름에 숫자가 붙지 않았는지 보고, 이 화면을 새로고침해 "지금 설치본"이 바뀌었는지 봅니다</li>'
      + '</ol>';
  }

  function showCurrent() {
    const build = info.build;
    const kind = build && build.kind === 'main' ? '' : build && build.kind ? ' <span class="badge plain">시험용 설치본</span>' : '';
    $('current').innerHTML = '<h2>지금 설치본</h2>'
      + '<p class="line"><b>v' + esc(info.appVersion || '?') + '</b>' + (build && build.tag ? ' · <span class="tag" id="currentTag">' + esc(build.tag) + '</span>' : '') + kind + '</p>'
      + (build && build.builtAt ? '<p class="note">' + esc(when(build.builtAt)) + '에 지은 설치본</p>' : '')
      + (build && build.tag ? '' : '<p class="note">이 설치본에는 지은 정보가 없습니다(이 화면이 생기기 전에 지은 것). 다음에 갱신하면 표시됩니다.</p>');
  }

  // 본 코드(main)로 만든 가장 새 설치본과 지금 설치본을 견준다.
  // 가장 새 설치본이 무엇인지는 설치본을 만든 작업이 적어 둔 파일(main-image.json)에서 읽는다.
  // 실행 기록(runs)은 '지금 만드는 중인지, 마지막에 실패했는지'를 알려 주는 데만 쓴다. 못 읽어도 된다.
  function showImage(image, runs) {
    const box = $('image');
    const actions = 'https://github.com/' + info.repository + '/actions/workflows/' + info.mergeWorkflow;
    let body = '';
    const latest = runs.data ? (runs.data.workflow_runs || []).find(run => run.head_branch === 'main') : null;
    if (latest && latest.status !== 'completed') body += '<p class="line" id="building">새 설치본을 <b>만드는 중</b>입니다(' + esc(when(latest.created_at)) + ' 시작). 15분쯤 걸립니다. 끝나면 새로고침해 주세요.</p>';
    else if (latest && latest.conclusion !== 'success') body += '<p class="line warn" id="buildFailed">마지막 설치본 만들기가 끝까지 가지 못했습니다(실패 또는 취소). <a href="' + esc(latest.html_url) + '" target="_blank" rel="noopener">실행 기록 보기</a></p>';

    const known = image.data && image.data.schemaVersion === 1 && /^[A-Za-z0-9._-]+$/.test(String(image.data.tag || '')) ? image.data : null;
    if (image.limited) body += '<p class="note">GitHub가 잠시 답하지 않습니다. 조금 뒤에 새로고침해 주세요.</p>';
    else if (image.missing) body += '<p class="note" id="imageState">본 코드로 만든 설치본이 아직 적혀 있지 않습니다. 이 화면이 본 코드에 들어간 뒤 처음 만든 설치본부터 적힙니다. <a href="' + esc(actions) + '" target="_blank" rel="noopener">실행 기록 보기</a></p>';
    else if (!known) body += '<p class="note">GitHub에서 설치본 기록을 읽지 못했습니다. <a href="' + esc(actions) + '" target="_blank" rel="noopener">실행 기록 보기</a></p>';
    else {
      const tag = known.tag;
      body += '<p class="line">가장 새 설치본: <span class="tag" id="latestTag">' + esc(tag) + '</span>'
        + ' <span class="note">(' + (known.version ? 'v' + esc(known.version) + ', ' : '') + esc(when(known.builtAt)) + ')</span></p>';
      const steps = nasSteps(tag, '이 앱이 들어 있는 프로젝트');
      if (info.build && info.build.tag === tag) body += '<p class="line" id="imageState"><span class="badge low">최신</span> 지금 설치본이 가장 새 것입니다.</p>';
      else if (info.build && info.build.kind && info.build.kind !== 'main') {
        // 시험용 설치본이 돌고 있는 곳(보통 복사본)에서는 '갱신하라'고 하지 않는다.
        body += '<p class="line" id="imageState"><span class="badge plain">견주지 않음</span> 지금 돌고 있는 것은 시험용 설치본이라, 본 코드의 설치본과 견주지 않습니다.</p>'
          + '<details><summary>본 코드의 설치본으로 바꾸는 순서 보기</summary>' + steps + '</details>';
      } else {
        body += '<p class="line" id="imageState"><span class="badge medium">갱신할 것 있음</span> 지금 설치본과 다릅니다. NAS에서 아래 순서로 바꿉니다.</p>'
          + '<p class="note">갱신하기 전에 스냅샷을 찍어 두세요(DSM → 스냅샷 복제 → docker 공유 폴더).</p>' + steps;
      }
    }
    box.innerHTML = '<h2>본 코드의 설치본</h2>' + body;
    return known ? String(known.commit || '') : '';
  }

  // RisuBard 새 버전: '미리 합쳐 보기'가 남긴 결과 파일을 보여 준다.
  function showUpstream(status, mainSha) {
    const box = $('upstream');
    const repo = 'https://github.com/' + info.repository;
    const checkPage = repo + '/actions/workflows/' + info.checkWorkflow;
    const mergePage = repo + '/actions/workflows/' + info.mergeWorkflow;
    const runCheck = '<a href="' + esc(checkPage) + '" target="_blank" rel="noopener">GitHub에서 "Bangju - update check" 열기</a> → <b>Run workflow</b>';
    let body = '';
    if (status.limited) body = '<p class="note">GitHub가 잠시 답하지 않습니다. 조금 뒤에 새로고침해 주세요.</p>';
    else if (status.missing) body = '<p class="line">아직 확인한 기록이 없습니다.</p><p class="note">한 번 확인하려면: ' + runCheck + '. 몇 분 뒤 이 화면을 새로고침합니다.</p>';
    else if (!status.data || status.data.schemaVersion !== 1) body = '<p class="note">확인 결과를 읽지 못했습니다. ' + runCheck + '</p>';
    else {
      const check = status.data;
      const stale = mainSha && check.base && check.base.sha && check.base.sha !== mainSha;
      // 자동 확인은 매일 돈다. 며칠째 그대로면 멈춘 것이다(GitHub는 오래 조용한 저장소의 예약 작업을 끈다).
      const days = Math.floor((Date.now() - new Date(check.checkedAt).getTime()) / 86400000);
      body += '<p class="note">' + esc(when(check.checkedAt)) + '에 확인함' + (check.runUrl ? ' · <a href="' + esc(check.runUrl) + '" target="_blank" rel="noopener">확인 기록</a>' : '') + '</p>';
      if (days >= 3) body += '<p class="line warn" id="old">마지막 확인이 ' + days + '일 전입니다. 매일 하는 자동 확인이 멈춘 것 같습니다. 직접 한 번 실행해 주세요: ' + runCheck + '</p>';
      if (stale) body += '<p class="line warn" id="stale">확인한 뒤에 본 코드가 바뀌었습니다. 아래 내용은 예전 기준입니다. 다시 확인해 주세요: ' + runCheck + '</p>';
      if (check.status === 'up-to-date') {
        body += '<p class="line" id="upstreamState"><span class="badge low">최신</span> 새 버전이 없습니다. RisuBard <b>' + esc(check.upstream.version) + '</b>까지 들어 있습니다.</p>';
      } else {
        const [riskName, riskClass] = RISK[check.risk] || RISK.medium;
        body += '<p class="line" id="upstreamState">RisuBard <b>' + esc(check.upstream.version || '') + '</b> 버전이 나와 있습니다. 변경 ' + check.commits.total + '개, 바뀐 파일 ' + check.files.total + '개.</p>'
          + '<p class="line">위험도 <span class="badge ' + riskClass + '" id="risk">' + riskName + '</span></p>'
          + '<ul id="reasons">' + (check.reasons || []).map(reason => '<li>' + esc(reason) + '</li>').join('') + '</ul>'
          + '<details><summary>바뀐 내용 ' + check.commits.total + '개 보기</summary><ul class="changes">'
          + (check.commits.list || []).map(item => '<li>' + esc(item.title) + ' <span>' + esc(String(item.date || '').slice(0, 10)) + '</span></li>').join('')
          + (check.commits.total > (check.commits.list || []).length ? '<li><span>… 그 밖에 ' + (check.commits.total - check.commits.list.length) + '개</span></li>' : '')
          + '</ul></details>';
        if (check.risk === 'high') {
          body += '<h2 style="margin-top:12px">지금은 받지 마세요</h2>'
            + (check.conflicts && check.conflicts.length ? '<p class="line">부딪치는 파일:</p><ul id="conflicts">' + check.conflicts.map(file => '<li><code>' + esc(file) + '</code></li>').join('') + '</ul>' : '')
            + '<p class="line">본 코드와 설치본은 그대로입니다. 이 화면을 Claude에게 보여 주고 합쳐 달라고 하면 됩니다.</p>';
        } else {
          const trial = check.trialImage && check.trialImage.tag ? check.trialImage.tag : '';
          const medium = check.risk !== 'low';
          body += '<h2 style="margin-top:12px">받는 순서</h2><ol class="steps">'
            + '<li><b>스냅샷을 찍습니다</b> (DSM → 스냅샷 복제 → docker 공유 폴더 → 스냅샷 촬영).<br>'
            + '<label><input type="checkbox" id="snapshotDone"> 스냅샷을 찍었습니다</label></li>'
            + '<li' + (medium ? '' : ' class="note"') + '><b>복사본에서 먼저 해 봅니다</b>' + (medium ? '' : ' (위험도가 낮아 건너뛰어도 됩니다)') + '.<br>'
            + (trial
              ? '복사본용 설치본: <span class="tag" id="trialTag">' + esc(trial) + '</span>. 복사본 프로젝트에서 아래 순서로 올리고, 평소 쓰는 것이 되는지 봅니다.' + nasSteps(trial, '복사본 프로젝트(예: bangju-test)')
              : '복사본용 설치본이 아직 없습니다. ' + runCheck + ' → <b>"복사본에서 먼저 해 볼 설치본도 만들기"를 체크</b>하고 실행합니다. 20분쯤 뒤 새로고침하면 여기에 이름표가 나옵니다.')
            + '</li>'
            + '<li id="mergeStep" class="hidden"><b>본 코드에 합칩니다.</b> <a href="' + esc(mergePage) + '" target="_blank" rel="noopener">GitHub에서 "Easy mode - RisuBard sync and image" 열기</a> → <b>Run workflow</b> → <b>"RisuBard 새 버전 합치기"를 체크</b> → Run workflow.<br>'
            + '<span class="note">저장소 첫 화면의 Sync fork나 Create pull request는 누르지 않습니다.</span></li>'
            + '<li id="nasStep" class="hidden"><b>NAS를 갱신합니다.</b> 15분쯤 뒤 이 화면을 새로고침하면 위 "본 코드의 설치본"에 새 이름표와 순서가 나옵니다.</li>'
            + '</ol><p class="note" id="snapshotNote">스냅샷을 찍었다고 표시하면 나머지 순서가 나옵니다.</p>';
        }
      }
      body += '<p class="note" style="margin-top:8px">지금 다시 확인하려면: ' + runCheck + '</p>';
    }
    box.innerHTML = '<h2>RisuBard 새 버전</h2>' + body;
    const done = $('snapshotDone');
    if (done) done.addEventListener('change', () => {
      for (const id of ['mergeStep', 'nasStep']) $(id).classList.toggle('hidden', !done.checked);
      $('snapshotNote').classList.toggle('hidden', done.checked);
    });
  }

  function showHistory() {
    const installs = (info.history || []).slice().reverse();
    const rows = installs.map((item, at) => '<li><span class="tag">' + esc(item.tag) + '</span> · v' + esc(item.appVersion || '?')
      + ' <span class="note">(' + esc(when(item.firstRunAt)) + '부터' + (at === 0 ? ', 지금' : '') + (item.kind && item.kind !== 'main' ? ', 시험용' : '') + ')</span></li>').join('');
    $('history').innerHTML = '<h2>이전 설치본</h2>'
      + (installs.length ? '<ul id="installs">' + rows + '</ul>' : '<p class="note">아직 기록이 없습니다. 이 화면이 들어간 설치본부터 기록됩니다.</p>')
      + '<details><summary>되돌리는 법</summary>'
      + '<p class="line">설치본은 위 NAS 순서와 똑같이, <code>image:</code> 줄의 끝을 되돌아갈 이름표로 바꾸면 됩니다.</p>'
      + '<p class="line">데이터는 이 화면이 되돌리지 않습니다. 새 버전이 저장 형식을 바꿨을 수 있으니, 갱신 전에 찍은 스냅샷으로 DSM에서 복원하는 것이 안전합니다.</p>'
      + '<p class="line warn">보관함에 봇이 있는 동안에는 보관함이 들어가기 전의 설치본으로 되돌리지 마세요. 이 목록에는 보관함이 들어간 뒤의 설치본만 적힙니다.</p>'
      + '</details>';
  }

  async function show() {
    showCurrent();
    showHistory();
    if (!info.repository) {
      $('image').innerHTML = '<h2>본 코드의 설치본</h2><p class="note">이 설치본은 어느 저장소에서 지은 것인지 적혀 있지 않아 GitHub에서 읽을 수 없습니다. 이 화면이 들어간 설치본으로 한 번 갱신하면 표시됩니다.</p>';
      $('upstream').innerHTML = '<h2>RisuBard 새 버전</h2><p class="note">위와 같은 이유로 아직 볼 수 없습니다.</p>';
      return;
    }
    $('image').innerHTML = '<h2>본 코드의 설치본</h2><p class="note">GitHub에서 읽는 중…</p>';
    $('upstream').innerHTML = '<h2>RisuBard 새 버전</h2><p class="note">GitHub에서 읽는 중…</p>';
    const raw = 'https://raw.githubusercontent.com/' + info.repository + '/' + info.statusBranch + '/';
    const [image, status, runs] = await Promise.all([
      github(raw + info.imageFile),
      github(raw + info.statusFile),
      github('https://api.github.com/repos/' + info.repository + '/actions/workflows/' + info.mergeWorkflow + '/runs?branch=main&per_page=5'),
    ]);
    const mainSha = showImage(image, runs);
    showUpstream(status, mainSha);
    $('foot').textContent = '저장소: ' + info.repository;
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-copy-button]');
    if (!button) return;
    const text = button.previousElementSibling ? button.previousElementSibling.textContent : '';
    const done = () => { button.textContent = '복사했습니다'; setTimeout(() => { button.textContent = '이 줄 복사'; }, 1500); };
    // 보안 연결이 아니면 클립보드를 쓸 수 없다: 그때는 글자를 골라 둔다.
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => {});
    else { const range = document.createRange(); range.selectNodeContents(button.previousElementSibling); const selection = getSelection(); selection.removeAllRanges(); selection.addRange(range); button.textContent = '골라 두었습니다 (Ctrl+C)'; }
  });
  $('loginButton').addEventListener('click', login);
  $('password').addEventListener('keydown', event => { if (event.key === 'Enter') login(); });
})();
</script>
</body>
</html>
