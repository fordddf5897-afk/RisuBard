name: Easy mode - RisuBard sync and image

# 매일 새벽 RisuBard 새 버전을 이 포크에 합치고, 검사를 통과하면 Docker 이미지
# (ghcr.io/<아이디>/<저장소>:latest)를 만듭니다. 충돌이나 검사 실패가 있으면 아무것도
# 올리지 않고 실행을 실패로 표시합니다(GitHub가 메일로 알려 줍니다).
# 설정 방법: deploy/synology/README.ko.md

on:
  schedule:
    # 매일 04:23 (한국 시간)
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      build_image:
        description: 'RisuBard 새 버전이 없어도 이미지를 다시 만들기'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: easy-mode-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/rpaddict/RisuBard.git
  UPSTREAM_BRANCH: main
  REGISTRY: ghcr.io

jobs:
  sync:
    name: Merge RisuBard and check
    # Only forks have something to merge.
    if: github.repository != 'rpaddict/RisuBard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.publish.outputs.sha }}
      version: ${{ steps.publish.outputs.version }}
      matrix: ${{ steps.decide.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          # Optional. A token with the 'workflow' scope lets RisuBard's own workflow
          # changes be pushed too; without it those (rare) merges stop with a note.
          token: ${{ secrets.EASY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream RisuBard
        id: sync
        shell: bash
        run: |
          set +e
          bash deploy/easy-ci-sync.sh
          code=$?
          set -e
          if [[ $code -ne 0 && $code -ne 2 ]]; then exit $code; fi

      - name: Report merge conflict
        if: steps.sync.outputs.status == 'conflict'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          UPSTREAM_VERSION: ${{ steps.sync.outputs.upstream_version }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "RisuBard ${UPSTREAM_VERSION} (${UPSTREAM_SHA:0:7})을 자동으로 합치지 못했습니다. 저장소와 이미지는 그대로입니다."
            echo ""
            echo "충돌한 파일:"
            echo "$CONFLICTS" | tr ',' '\n' | sed 's/^/- /'
            echo ""
            echo "고치는 법: 이 목록과 docs/easy-mode.md의 '기존 파일 연결점'을 Claude에게 보여 주고,"
            echo "deploy/easy-sync-upstream.sh로 병합을 마무리한 뒤 push 하세요. push 하면 이 작업이 다시 돌아 이미지를 만듭니다."
            echo "GitHub 화면의 Sync fork에서 Discard commits는 누르지 마세요. 간편 모드가 지워집니다."
            echo ""
            echo "실행 기록: $RUN_URL"
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          title="간편 모드: RisuBard ${UPSTREAM_VERSION} 자동 병합 충돌"
          # Issues are off by default in forks; the failed run still sends a mail.
          if gh issue list --state open --search "in:title $title" --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
            echo "같은 내용의 이슈가 이미 열려 있습니다."
          else
            gh issue create --title "$title" --body-file /tmp/report.md || echo "이슈를 만들 수 없습니다(포크의 Issues가 꺼져 있을 수 있음)."
          fi
          exit 1

      - name: Stop on RisuBard workflow changes without a token
        if: steps.sync.outputs.status == 'merged'
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.EASY_SYNC_TOKEN != '' }}
          UPSTREAM_VERSION: ${{ steps.sync.outputs.upstream_version }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- .github/workflows)
          if [[ -z "$changed" || "$HAS_TOKEN" == "true" ]]; then exit 0; fi
          {
            echo "RisuBard ${UPSTREAM_VERSION}이 GitHub 워크플로 파일을 바꿔서, 기본 권한으로는 자동으로 올릴 수 없습니다."
            echo ""
            # shellcheck disable=SC2001 # prefix every line of a multi-line list
            echo "$changed" | sed 's/^/- /'
            echo ""
            echo "병합 자체는 충돌 없이 됩니다. 저장소 첫 화면에서 Sync fork → Update branch를 누르면 끝납니다."
            echo "(Discard commits는 누르지 마세요.) 그러면 이 작업이 다시 돌아 이미지를 만듭니다."
            echo "매번 자동으로 하려면 deploy/synology/README.ko.md의 EASY_SYNC_TOKEN 설정을 참고하세요."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Decide what to do
        id: decide
        shell: bash
        env:
          STATUS: ${{ steps.sync.outputs.status }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.build_image }}
          ARM64: ${{ vars.EASY_ARM64 }}
          HAS_TOKEN: ${{ secrets.EASY_SYNC_TOKEN != '' }}
        run: |
          check=false
          build=false
          if [[ "$STATUS" == "merged" || "$EVENT" == "push" || "$FORCE" == "true" ]]; then check=true; build=true; fi
          # A push made with EASY_SYNC_TOKEN starts this workflow again, and that run builds.
          if [[ "$STATUS" == "merged" && "$HAS_TOKEN" == "true" && "$EVENT" != "push" && "$FORCE" != "true" ]]; then build=false; fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          matrix='[{"platform":"linux/amd64","runner":"ubuntu-latest"}'
          if [[ "$ARM64" == "true" ]]; then
            matrix="$matrix"',{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}'
          fi
          echo "matrix=$matrix]" >> "$GITHUB_OUTPUT"
          if [[ "$check" == "false" ]]; then
            echo "RisuBard 새 버전이 없습니다. 할 일이 없습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.decide.outputs.check == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        if: steps.decide.outputs.check == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Get pnpm store directory
        if: steps.decide.outputs.check == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: steps.decide.outputs.check == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.decide.outputs.check == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check easy mode
        if: steps.decide.outputs.check == 'true'
        id: check
        run: bash deploy/easy-ci-check.sh

      - name: Report failed checks
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ steps.sync.outputs.upstream_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "RisuBard ${UPSTREAM_VERSION:-최신}을 합친 뒤 간편 모드 검사가 실패했습니다. 병합은 올리지 않았고 이미지도 그대로입니다."
            echo ""
            echo "실행 기록의 'Check easy mode' 단계 로그를 Claude에게 보여 주세요: $RUN_URL"
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "간편 모드: 검사 실패 (RisuBard ${UPSTREAM_VERSION:-최신})" --body-file /tmp/report.md || true

      - name: Push merge
        if: steps.sync.outputs.status == 'merged'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Publish result
        id: publish
        if: steps.decide.outputs.check == 'true'
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            if [[ "${{ steps.decide.outputs.build }}" == "true" ]]; then
              echo "RisuBard $version 기준으로 검사를 통과했습니다. 이미지를 만듭니다."
            else
              echo "RisuBard $version 기준으로 검사를 통과해 올렸습니다. 이미지는 이어서 시작되는 실행에서 만듭니다."
            fi
            if [[ "${{ steps.sync.outputs.status }}" == "merged" ]]; then echo "새로 합친 RisuBard: ${{ steps.sync.outputs.upstream_sha }}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build image (${{ matrix.platform }})
    needs: sync
    if: needs.sync.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Names
        id: names
        shell: bash
        run: |
          echo "image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=easy-${{ steps.names.outputs.pair }}
          cache-to: type=gha,scope=easy-${{ steps.names.outputs.pair }},mode=max

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: easy-digest-${{ steps.names.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag image
    needs: [sync, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: easy-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        env:
          VERSION: ${{ needs.sync.outputs.version }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:easy-${VERSION}" \
            -t "${IMAGE}:sha-${SHA:0:7}" \
            $(printf "${IMAGE}@sha256:%s " *)
          {
            echo "이미지를 올렸습니다."
            echo ""
            echo "- \`${IMAGE}:latest\`"
            echo "- \`${IMAGE}:easy-${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
