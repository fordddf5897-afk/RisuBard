# Synology Container Manager 프로젝트용 compose 파일. 순서는 같은 폴더의 README.ko.md를 보세요.
#
# image: 내 GitHub 포크가 만든 이미지로 바꿉니다(아이디와 저장소 이름은 소문자).
#   :latest 는 매일 자동으로 갱신됩니다. 특정 버전에 묶으려면 :easy-0.9.96 처럼 씁니다.
# volumes: 캐릭터, 채팅, BardWiki, 세이브 슬롯, 서버 백업이 전부 save 폴더에 저장됩니다.
services:
  risubard:
    container_name: risubard
    image: ghcr.io/YOUR_GITHUB_ID/YOUR_REPO:latest
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - /volume1/docker/risubard/save:/app/save
